<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeTube Admin Paneli</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h2 {
      margin-bottom: 15px;
      color: #ff0000;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
      font-size: 14px;
    }
    input {
      background-color: #2b2b2b;
      color: #ffffff;
    }
    button {
      background-color: #ff0000;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #cc0000;
    }
    .video-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2a2a2a;
      padding: 10px 15px;
      margin-top: 10px;
      border-radius: 6px;
    }
    .delete-btn {
      background-color: #d32f2f;
      width: auto;
      padding: 6px 12px;
      margin: 0;
    }
    .delete-btn:hover {
      background-color: #9a0007;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>MeTube Admin Paneli</h2>
    <input type="text" id="titleInput" placeholder="Video Başlığı">
    <input type="text" id="urlInput" placeholder="GitHub Release MP4 Linki">
    <button onclick="videoEkle()">Video Ekle</button>

    <h3 style="margin-top: 25px; border-top: 1px solid #333; padding-top: 15px;">Mevcut Videolar</h3>
    <div id="videoList"></div>
  </div>

  <script>
    const BIN_ID = '6ac907e0ac6210605a22f1d5';
    const API_KEY = '$2a$10$G8QimcR2WSYfENqVonrsM.FNt5AWlTmTu7zaWDCYEPyZdsEJxXf1K';
    
    let mevcutVideolar = [];

    async function videolariGetir() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        mevcutVideolar = data.record || [];
        
        const listDiv = document.getElementById('videoList');
        listDiv.innerHTML = '';
        mevcutVideolar.forEach((item, index) => {
          listDiv.innerHTML += `
            <div class="video-item">
              <span>${item.baslik}</span>
              <button class="delete-btn" onclick="videoSil(${index})">Sil</button>
            </div>
          `;
        });
      } catch (err) {
        console.error('Hata:', err);
      }
    }

    async function kaydet(yeniListe) {
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify(yeniListe)
      });
      videolariGetir();
    }

    function videoEkle() {
      const baslik = document.getElementById('titleInput').value;
      const url = document.getElementById('urlInput').value;
      if (!baslik || !url) return alert('Lütfen tüm alanları doldurun!');

      mevcutVideolar.unshift({ baslik, url });
      kaydet(mevcutVideolar);

      document.getElementById('titleInput').value = '';
      document.getElementById('urlInput').value = '';
    }

    function videoSil(index) {
      if (confirm('Bu videoyu silmek istediğinize emin misiniz?')) {
        mevcutVideolar.splice(index, 1);
        kaydet(mevcutVideolar);
      }
    }

    videolariGetir();
  </script>
</body>
</html>
